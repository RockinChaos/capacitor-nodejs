name: Release

on:
  workflow_dispatch:

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    name: Build, Generate & Draft Release
    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v6
        with:
          node-version: '24.22.1'
          cache: 'pnpm'

      - name: Get package version
        id: pkg
        run: echo "version=$(node -p "require('./package.json').version")" >> $GITHUB_OUTPUT

      - name: Check version not already released
        id: check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="v${{ steps.pkg.outputs.version }}"
          RELEASE=$(gh release view "$TAG" --json isDraft -q '.isDraft' 2>/dev/null || echo "not_found")
          if [ "$RELEASE" = "false" ]; then
            echo "Release $TAG already exists and is published. Aborting."
            exit 1
          fi
          echo "Safe to proceed."

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm run release

      - name: Pack
        run: pnpm run pack

      - name: Create draft release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: v${{ steps.pkg.outputs.version }}
          name: ${{ steps.pkg.outputs.version }}
          draft: true
          files: build/capacitor-nodejs-*.tgz

      - name: Update Docs
        run: pnpm run docgen

      - name: Commit updated README
        uses: stefanzweifel/git-auto-commit-action@v7
        with:
          commit_message: 'chore: update docs'
          file_pattern: README.md dist/docs.json